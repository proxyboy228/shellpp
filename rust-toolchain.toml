# The Rust toolchain of the whole client workspace (and of CI).
# gpui-kit 0.7.3 pins GPUI snapshot gpui-pre 0.3.9, which needs Rust >= 1.93
# (the workspace `rust-version`); GPUI snapshots track recent stable Rust, so
# the toolchain is pinned and upgraded together with gpui-kit.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
