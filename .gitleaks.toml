# gitleaks configuration: default rule set plus project-specific allowlists.
# Keep allowlist entries narrow and explain each one in the PR that adds it.
title = "gitleaks config"

[extend]
useDefault = true

# Known-answer test vectors (docs/storage-format.md, section 14.3): every
# key in these files is derived from fixed, public test inputs and protects
# nothing.
[[allowlists]]
description = "crypto known-answer test vectors"
paths = ['''(^|/)crates/core/tests/vectors/kat_[a-z_]+\.json$''']

# The keychain account name in the ids unit test is built from a fixed
# test UUID, not from a key.
[[allowlists]]
description = "keychain account name in the ids unit test"
regexTarget = "match"
regexes = ['''device-key:0199f6a1-b2c3-7d4e-8f00-112233445566''']

# Source code that builds or recognizes OpenSSH/PEM armor: around key bytes
# generated at run time (crates/core/tests/stage2), around placeholder bodies
# ("AAAA", "Proc-Type" header only, crypto.randomUUID() in the mock key
# format of src/ipc/mock/connect.ts), or as shell command samples of the
# history secret detector. The default private-key rule matches from a BEGIN
# line to the next "KEY-----" across ordinary code; each regex below pins the
# code that directly follows the BEGIN line, which base64 key data never is.
[[allowlists]]
description = "private-key armor in test and mock code (no key material)"
targetRules = ["private-key"]
condition = "AND"
paths = [
  '''(^|/)crates/core/tests/stage2/mod\.rs$''',
  '''(^|/)crates/ssh/tests/auth\.rs$''',
  '''(^|/)crates/ssh/src/auth\.rs$''',
  '''(^|/)crates/core/src/history/tests\.rs$''',
  '''(^|/)apps/desktop/src/features/connect/KeyAddDialog\.test\.tsx$''',
  '''(^|/)apps/desktop/src/features/panels/HostPanel\.stage2\.test\.tsx$''',
  '''(^|/)apps/desktop/src/ipc/mock/mock\.connect\.test\.ts$''',
  '''(^|/)apps/desktop/src/ipc/mock/connect\.ts$''',
]
regexTarget = "match"
regexes = [
  '''^-----BEGIN OPENSSH PRIVATE KEY-----\\n"\);\n''',
  '''^-----BEGIN OPENSSH PRIVATE KEY-----\\nAAAA\\n-----END OPENSSH PRIVATE KEY-----\\n",''',
  '''^-----BEGIN RSA PRIVATE KEY-----\\nProc-Type: 4,ENCRYPTED\\n"\n''',
  '''^-----BEGIN OPENSSH PRIVATE KEY-----' > k"\.to_owned\(\),\n''',
  '''^-----BEGIN OPENSSH PRIVATE KEY-----',\s*(?:options\.body \?\? )?crypto\.randomUUID\(\)''',
  '''^-----BEGIN OPENSSH PRIVATE KEY-----`; optional lines\n''',
]

# Synthetic samples of the history secret detector tests (docs/security.md,
# section 10.2): token-shaped strings made of the alphabet, and a curl
# command with a placeholder user, that the detector must classify.
[[allowlists]]
description = "synthetic samples of the history secret detector tests"
targetRules = ["aws-access-token", "stripe-access-token", "curl-auth-user"]
condition = "AND"
paths = ['''(^|/)crates/core/src/history/tests\.rs$''']
regexes = [
  '''^(?:AKIA|ASIA)ABCDEFGHIJKLMNOP$''',
  '''^sk_test_abcdefghijklmnop$''',
  '''^admin:admin@$''',
]

# The published russh 0.64.1 source, kept under third_party/russh for its
# patches (D100, D191): its own unit tests carry the upstream's sample keys,
# which protect nothing. Only that directory.
[[allowlists]]
description = "upstream russh test keys in the patched copy"
paths = ['''^third_party/russh/src/''']

# Android release signing (D223; docs/mobile/release.md): the owner's key
# and its passwords live outside the repository. A keystore file anywhere,
# a signing password written in a properties file, or a password literal in
# a Gradle file is a finding. (The Gradle files read the passwords from the
# environment, which these rules do not match.)
[[rules]]
id = "android-keystore-file"
description = "a Java or Android keystore file"
path = '''(?i)\.(jks|keystore|p12|pfx)$'''

[[rules]]
id = "android-signing-password-properties"
description = "an Android signing password in a properties file"
path = '''(?i)\.properties$'''
regex = '''(?i)(storePassword|keyPassword|store\.password|key\.password)\s*[=:]\s*\S{4,}'''

[[rules]]
id = "android-signing-password-gradle"
description = "an Android signing password as a literal in a Gradle file"
path = '''(?i)\.gradle(\.kts)?$'''
regex = '''(?i)(storePassword|keyPassword)\s*=\s*["'][^"'$]{4,}["']'''
