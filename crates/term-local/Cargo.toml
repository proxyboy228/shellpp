[package]
name = "shellpp-term-local"
description = "Shell++ local terminal: shell detection, a portable-pty session and serial ports (desktop only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Desktop only (decision 5): shellpp-desktop links this crate only for desktop
# targets. Serial ports since stage 9 (D88); Telnet lives in the desktop app.
[dependencies]
portable-pty.workspace = true
serialport.workspace = true
tokio = { workspace = true, features = ["sync"] }
thiserror.workspace = true
tracing.workspace = true
dirs.workspace = true

# The job object of the WSL listing (src/windows.rs, D100).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "time", "macros"] }

[lints]
workspace = true
