name: Bug report
description: Report a reproducible problem in Shell++.
title: "bug: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security issues must not be reported here.** Follow [SECURITY.md](https://github.com/proxyboy228/shellpp/blob/main/SECURITY.md) to report them privately.

        Never paste private keys, passwords, passphrases, tokens, or hostnames and IP addresses you consider sensitive.
        Do not attach screenshots, assets or texts from other proprietary SSH clients. Shell++ is a clean-room implementation.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The minimal steps needed to reproduce the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs actual behavior
      description: What you expected to happen and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release version or commit hash you are using.
      placeholder: "e.g. 0.1.0 or a1b2c3d"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
  - type: textarea
    id: os-details
    attributes:
      label: Operating system details
      description: OS version, architecture and, on Linux, distribution and display server.
      placeholder: "e.g. Windows 11 23H2 x64, macOS 14.5 arm64, Ubuntu 24.04 Wayland"
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app
        - Terminal
        - SFTP
        - Port forwarding
        - Keychain / keys
        - Sync client
        - Sync server
        - Import / export
        - Docs
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Redact secrets, tokens, passwords, private keys and sensitive hostnames or IP addresses before pasting. This field is formatted as code automatically.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: false
        - label: I removed secrets and sensitive data from this report
          required: true
