name: CI

# Job set of docs/architecture.md, section 9.2: lint, licenses, linux,
# windows, macos, plus integration (OpenSSH in Docker) and the Windows
# release artifact (run 4). The gitleaks job lives in secret-scan.yml.
#
# The toolchain comes from rust-toolchain.toml (Rust 1.99.1 with rustfmt and
# clippy; gpui-kit's GPUI needs Rust >= 1.93). The desktop app is GPUI Kit:
# its UI tests run headless inside `cargo test` (GPUI's test platform, no
# window, no display server) with temporary data directories only
# (SHELLPP_TEST=1 makes a missing SHELLPP_DATA_DIR an error).
#
# SSH integration (docs/architecture.md, sections 9.1 and 9.3): every Rust
# test run uses the russh test server (tests/sshd, SHELLPP_TEST_SSHD=russh);
# the integration job runs the shellpp-ssh suite and the desktop app's
# session tests against OpenSSH in Docker (tests/openssh,
# SHELLPP_TEST_SSHD=openssh). The sync server's tests run in server.yml and
# its deployment tests in server-deploy.yml, both only on the changes they
# test; packages join in later stages.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  # System libraries GPUI links on Linux (xkbcommon, xcb, fontconfig,
  # freetype; Wayland is loaded at run time) plus pkg-config to find them,
  # and libudev for hidapi (the desktop's `fido2-hid` feature, D143, built
  # by the --all-features steps).
  LINUX_GPUI_PACKAGES: >-
    pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev
    libx11-xcb-dev libfontconfig-dev libfreetype-dev libwayland-dev
    libudev-dev

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without a name, rustup installs the toolchain of rust-toolchain.toml
      # (channel, profile and components).
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: rustfmt (server workspace)
        if: hashFiles('server/Cargo.toml') != ''
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_GPUI_PACKAGES shellcheck

      # Scripts of the OpenSSH test server (tests/openssh), of the Linux app's
      # check in a container (tests/linux) and of the release packages
      # (scripts/*.sh).
      - name: shellcheck
        run: shellcheck tests/openssh/*.sh tests/openssh/variants/*.sh tests/openssh/compat/*.sh tests/linux/*.sh scripts/*.sh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: clippy (all features, including dev-tools)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Without --all-targets, as a release build sees the code: the tests'
      # dev-dependencies would turn on shellpp-core's test-hooks for the whole
      # workspace and hide code only the hooks use (D205).
      - name: clippy (libraries and binaries)
        run: cargo clippy --locked --workspace -- -D warnings

      - name: clippy (server workspace)
        if: hashFiles('server/Cargo.toml') != ''
        run: cargo clippy --locked --manifest-path server/Cargo.toml --workspace --all-targets -- -D warnings

      - name: clippy (server workspace, all features)
        if: hashFiles('server/Cargo.toml') != ''
        run: cargo clippy --locked --manifest-path server/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: clippy (server workspace, libraries and binaries)
        if: hashFiles('server/Cargo.toml') != ''
        run: cargo clippy --locked --manifest-path server/Cargo.toml --workspace -- -D warnings

  licenses:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: "0.20.2"
      # SHA-256 of cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz
      # (the digest of the release asset).
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: Install cargo-deny
        working-directory: ${{ runner.temp }}
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLo "$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir cargo-deny-dist
          tar -xzf "$archive" -C cargo-deny-dist
          binary="$(find cargo-deny-dist -type f -name cargo-deny -print -quit)"
          sudo install -m 0755 "$binary" /usr/local/bin/cargo-deny
          cargo deny --version

      # deny.toml: licenses (shipped list), bans, advisories (RustSec), sources.
      - name: cargo-deny
        run: cargo deny --locked check

      - name: cargo-deny (server workspace)
        if: hashFiles('server/deny.toml') != ''
        run: cargo deny --locked --manifest-path server/Cargo.toml check

      # The notices script uses only Node's built-in modules (no npm packages).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The Rust table must match the crates that ship in the desktop binary.
      - name: Rust crates recorded in THIRD_PARTY_NOTICES.md
        run: node scripts/rust-notices.mjs

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_GPUI_PACKAGES

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add aarch64-linux-android
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Includes the shellpp-ssh suite against the russh test server and the
      # headless GPUI tests of the desktop app.
      - name: Rust tests
        env:
          SHELLPP_TEST_SSHD: russh
          SHELLPP_TEST: "1"
        run: cargo test --locked --no-fail-fast --workspace

      # The desktop app with its developer features (dev-tools, screenshots):
      # the demo data and every state of the screenshot mode are reached in
      # GPUI's headless test platform (no window, temporary profiles,
      # in-memory secret store).
      - name: Rust tests (desktop, all features)
        env:
          SHELLPP_TEST: "1"
          # The OpenSSH runs are the integration job's.
          SHELLPP_TEST_SSHD: russh
        run: cargo test --locked --no-fail-fast -p shellpp-desktop --all-features

      # The crates shared with the Android app stay mobile-ready
      # (docs/architecture.md, section 2.3), the same list as the local
      # criterion (CLAUDE.md). The C parts (bundled SQLite, ring) are compiled
      # with the runner's NDK, API 26 as locally.
      - name: Android check (the crates shared with the phone)
        run: |
          ndk_bin="${ANDROID_NDK_LATEST_HOME:?Android NDK not found on the runner}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo check --locked --target aarch64-linux-android -p shellpp-core -p shellpp-ssh -p shellpp-sync-api -p shellpp-private-file -p shellpp-sessions -p shellpp-terminal

      - name: Build the app
        run: cargo build --locked -p shellpp-desktop

  # OpenSSH in Docker (tests/openssh/README.md): the shellpp-ssh suite and
  # the desktop app's session tests (password, key, keyboard-interactive,
  # wrong password, first connection, host key change, drop and reconnect)
  # against a real OpenSSH server. The image is built once; every test server
  # container gets its own generated credentials and host keys from
  # tests/openssh/start.sh. SHELLPP_TEST_SSHD=openssh makes the suites fail
  # instead of falling back to the russh test server.
  integration:
    name: SSH integration (OpenSSH in Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHELLPP_TEST: "1"
      SHELLPP_TEST_SSHD: openssh
      SHELLPP_OPENSSH_IMAGE: shellpp-test-openssh:ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_GPUI_PACKAGES

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the OpenSSH test image
        run: docker build --tag "$SHELLPP_OPENSSH_IMAGE" tests/openssh

      # The image's tools and the server-side faults of control.sh, before
      # the suites rely on them.
      - name: Check the OpenSSH test server and its controls
        run: |
          workdir="$(mktemp -d)"
          trap 'bash tests/openssh/stop.sh "$workdir"; rm -rf "$workdir"' EXIT
          json="$(bash tests/openssh/start.sh "$workdir")"
          name="$(cat "$workdir/container")"
          docker exec "$name" sh -c 'command -v htop && command -v mc && command -v seq && command -v pkill'
          before="$(grep '"host_keys"' "$json")"
          bash tests/openssh/control.sh "$workdir" rotate-host-key
          after="$(grep '"host_keys"' "$json")"
          if [ "$before" = "$after" ]; then echo 'the host keys did not change' >&2; exit 1; fi
          bash tests/openssh/control.sh "$workdir" drop-connections
          bash tests/openssh/control.sh "$workdir" freeze
          bash tests/openssh/control.sh "$workdir" thaw
          # Still serving after the faults.
          port="$(docker port "$name" 22/tcp | head -n 1)"
          exec 3<>"/dev/tcp/127.0.0.1/${port##*:}"
          IFS= read -r -t 10 banner <&3
          case "$banner" in SSH-2.0-*) ;; *) echo 'no SSH banner after the faults' >&2; exit 1 ;; esac

      - name: shellpp-ssh suite (OpenSSH in Docker)
        run: cargo test --locked -p shellpp-ssh

      - name: Desktop session tests (OpenSSH in Docker)
        run: cargo test --locked -p shellpp-desktop --test sessions -- --nocapture

      # The server compatibility matrix (docs/compatibility.md, D80): each
      # server and variant in its own container.
      - name: Server compatibility matrix (Docker)
        run: |
          docker build --tag shellpp-compat-centos7:ci -f tests/openssh/compat/centos7.Dockerfile tests/openssh
          docker build --tag shellpp-compat-dropbear:ci -f tests/openssh/compat/dropbear.Dockerfile tests/openssh
          for entry in               "$SHELLPP_OPENSSH_IMAGE|"               "shellpp-compat-centos7:ci|"               "shellpp-compat-dropbear:ci|"               "$SHELLPP_OPENSSH_IMAGE|legacy-sha1"               "$SHELLPP_OPENSSH_IMAGE|kbd-2fa"               "$SHELLPP_OPENSSH_IMAGE|no-sftp"               "$SHELLPP_OPENSSH_IMAGE|motd-banner"; do
            image="${entry%%|*}"
            variant="${entry#*|}"
            workdir="$(mktemp -d)"
            json="$(SHELLPP_OPENSSH_IMAGE="$image" SHELLPP_OPENSSH_VARIANT="$variant" bash tests/openssh/start.sh "$workdir")"
            SHELLPP_OPENSSH_SERVER_JSON="$json" cargo test --locked -p shellpp-ssh --test compat -- --nocapture
            bash tests/openssh/stop.sh "$workdir"
            rm -rf "$workdir"
          done

      # A hashed known_hosts entry imported for the server's real key.
      - name: Desktop known_hosts import tests (OpenSSH in Docker)
        run: cargo test --locked -p shellpp-desktop --test known_hosts -- --nocapture

      # PuTTY .ppk import against keys that PuTTY's own puttygen generates in
      # a container at test time (tests/putty; stage 3, D32).
      - name: Build the puttygen test image
        run: docker build --tag shellpp-test-putty:ci tests/putty

      - name: Key import tests against puttygen (Docker)
        env:
          SHELLPP_TEST_PUTTYGEN: docker
          SHELLPP_PUTTY_IMAGE: shellpp-test-putty:ci
        run: cargo test --locked -p shellpp-core --test key_formats_putty -- --nocapture

      - name: Remove OpenSSH test containers
        if: always()
        run: bash tests/openssh/stop.sh --all

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Includes the shellpp-ssh suite against the russh test server and the
      # headless GPUI tests of the desktop app.
      - name: Rust tests
        env:
          SHELLPP_TEST_SSHD: russh
          SHELLPP_TEST: "1"
        run: cargo test --locked --no-fail-fast --workspace

      # As the local criterion runs on Windows: the desktop app with every
      # feature (dev-tools, screenshots, fido2-hid).
      - name: Rust tests (desktop, all features)
        env:
          SHELLPP_TEST: "1"
          SHELLPP_TEST_SSHD: russh
        run: cargo test --locked --no-fail-fast -p shellpp-desktop --all-features

      - name: Build the app
        run: cargo build --locked -p shellpp-desktop

      # Informational only (owner's stage 1, step 4): idle memory of the
      # release build on 300 demo hosts (a temporary profile, in-memory
      # secret store), 10 s after the window appears. The step never fails
      # the job: a missing desktop session or GPU on the runner only shows
      # up as a failed step in the log.
      - name: Idle memory, release, 300 hosts (informational)
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        env:
          SHELLPP_TEST: "1"
        run: ./scripts/measure-idle.ps1

      # Informational, like the idle memory: the cold start to the first
      # frame of the main window (SPEC.md, "Performance": under 1 s).
      - name: Cold start, release (informational)
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        env:
          SHELLPP_TEST: "1"
        run: ./scripts/measure-startup.ps1 -Scenario first-run

  # The Windows release artifact (run 4, plan 9.5;
  # scripts/package-windows.ps1): the portable zip of the dist profile
  # (fat LTO, one codegen unit; the version resource from Cargo.toml) with
  # its SHA-256, and the PDB apart, kept for 14 days. Pushes to main only
  # (two fat-LTO builds per pull request would cost too much). No signing,
  # no publishing; the MSI waits for the owner's choice of installer tool
  # (docs/decisions.md, D82).
  windows-release:
    name: Windows release artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build and package
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Keep the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shellpp-windows-x64
          path: |
            target/package/*.zip
            target/package/*.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Keep the symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shellpp-windows-x64-pdb
          path: target/package/shellpp.pdb
          retention-days: 14
          if-no-files-found: warn

  # Informational (D225, items 4 and 17): macOS is not supported in 1.0 and
  # nobody can check it locally, so a failure here never fails the run; it
  # is the only signal of how the code fares on macOS.
  macos:
    name: macOS (informational)
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add aarch64-apple-ios
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Includes the shellpp-ssh suite against the russh test server and the
      # headless GPUI tests of the desktop app.
      - name: Rust tests
        env:
          SHELLPP_TEST_SSHD: russh
          SHELLPP_TEST: "1"
        run: cargo test --locked --no-fail-fast --workspace

      # shellpp-core and shellpp-ssh stay mobile-ready (docs/architecture.md,
      # section 2.3).
      - name: iOS check (shellpp-core, shellpp-ssh)
        run: cargo check --locked -p shellpp-core -p shellpp-ssh --target aarch64-apple-ios

      # Release build of the app, without packages (the .dmg arrives in
      # stage 9). The screens are verified with docs/testing/macos-checklist.md.
      - name: Build the app
        run: cargo build --locked --release -p shellpp-desktop
