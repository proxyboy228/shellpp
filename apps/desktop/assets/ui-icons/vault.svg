<!-- Shell++ vault icon: a safe with a dial, a handle and feet, drawn on the Lucide 24 px grid (stroke 2, round caps and joins). It replaces Lucide's "vault", whose four bolts read as a cross ("close") at 16 px. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="18" height="16" x="3" y="3" rx="2" />
  <circle cx="10.5" cy="11" r="3" />
  <path d="M17 9v4" />
  <path d="M7 19v2" />
  <path d="M17 19v2" />
</svg>
