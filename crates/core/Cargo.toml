[package]
name = "shellpp-core"
description = "Shell++ core: data model, cryptography, storage, lock, in-memory index, settings, notifications and platform traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# shellpp-core must stay mobile-ready (docs/architecture.md, section 1.2):
# no tauri, keyring or other desktop-only crates, and no OS directory lookups.
[dependencies]
shellpp-sync-api.workspace = true

argon2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
getrandom.workspace = true
subtle.workspace = true
zeroize.workspace = true
secrecy.workspace = true

rusqlite.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
data-encoding.workspace = true
unicode-normalization.workspace = true
time.workspace = true

thiserror.workspace = true
tracing.workspace = true

# Stage 2: key import and fingerprints ("+ -> Key", docs/data-model.md, section
# 9.1), hashed known_hosts matching (section 9.5) and the history secret
# detector (docs/security.md, section 10).
ssh-key.workspace = true
hmac.workspace = true
sha1.workspace = true
regex.workspace = true

[dev-dependencies]
