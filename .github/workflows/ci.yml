name: CI

# Job set of docs/architecture.md, section 9.2: lint, licenses, linux,
# windows, macos. The gitleaks job lives in secret-scan.yml.
#
# The toolchain comes from rust-toolchain.toml (Rust 1.99.1 with rustfmt and
# clippy; gpui-kit's GPUI needs Rust >= 1.93). The desktop app is GPUI Kit:
# its UI tests run headless inside `cargo test` (GPUI's test platform, no
# window, no display server) with temporary data directories only
# (SHELLPP_TEST=1 makes a missing SHELLPP_DATA_DIR an error).
#
# SSH integration (docs/architecture.md, sections 9.1 and 9.3): every Rust
# test run uses the russh test server (tests/sshd, SHELLPP_TEST_SSHD=russh);
# the linux job also runs the shellpp-ssh suite against OpenSSH in Docker
# (tests/openssh, SHELLPP_TEST_SSHD=openssh). The sync server and packages
# join in later stages.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  # System libraries GPUI links on Linux (xkbcommon, xcb, fontconfig,
  # freetype; Wayland is loaded at run time) plus pkg-config to find them.
  LINUX_GPUI_PACKAGES: >-
    pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev
    libx11-xcb-dev libfontconfig-dev libfreetype-dev libwayland-dev

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without a name, rustup installs the toolchain of rust-toolchain.toml
      # (channel, profile and components).
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: rustfmt (server workspace)
        if: hashFiles('server/Cargo.toml') != ''
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_GPUI_PACKAGES shellcheck

      # Scripts of the OpenSSH test server (tests/openssh).
      - name: shellcheck
        run: shellcheck tests/openssh/*.sh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: clippy (all features, including dev-tools)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: clippy (server workspace)
        if: hashFiles('server/Cargo.toml') != ''
        run: cargo clippy --locked --manifest-path server/Cargo.toml --workspace --all-targets -- -D warnings

  licenses:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: "0.20.2"
      # SHA-256 of cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz
      # (the digest of the release asset).
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: Install cargo-deny
        working-directory: ${{ runner.temp }}
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLo "$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir cargo-deny-dist
          tar -xzf "$archive" -C cargo-deny-dist
          binary="$(find cargo-deny-dist -type f -name cargo-deny -print -quit)"
          sudo install -m 0755 "$binary" /usr/local/bin/cargo-deny
          cargo deny --version

      # deny.toml: licenses (shipped list), bans, advisories (RustSec), sources.
      - name: cargo-deny
        run: cargo deny --locked check

      - name: cargo-deny (server workspace)
        if: hashFiles('server/deny.toml') != ''
        run: cargo deny --locked --manifest-path server/Cargo.toml check

      # The notices script uses only Node's built-in modules (no npm packages).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The Rust table must match the crates that ship in the desktop binary.
      - name: Rust crates recorded in THIRD_PARTY_NOTICES.md
        run: node scripts/rust-notices.mjs

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_GPUI_PACKAGES

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add aarch64-linux-android
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Includes the shellpp-ssh suite against the russh test server and the
      # headless GPUI tests of the desktop app.
      - name: Rust tests
        env:
          SHELLPP_TEST_SSHD: russh
          SHELLPP_TEST: "1"
        run: cargo test --locked --workspace

      # The desktop app with its developer features (dev-tools, screenshots):
      # the demo data and every state of the screenshot mode are reached in
      # GPUI's headless test platform (no window, temporary profiles,
      # in-memory secret store).
      - name: Rust tests (desktop, all features)
        env:
          SHELLPP_TEST: "1"
        run: cargo test --locked -p shellpp-desktop --all-features

      # OpenSSH in Docker for the shellpp-ssh suite (tests/openssh/README.md).
      # The image is built once here; each test server container gets its own
      # generated credentials and host keys from tests/openssh/start.sh.
      - name: Build the OpenSSH test image
        run: docker build --tag shellpp-test-openssh:ci tests/openssh

      - name: SSH integration (OpenSSH in Docker)
        env:
          SHELLPP_TEST_SSHD: openssh
          SHELLPP_OPENSSH_IMAGE: shellpp-test-openssh:ci
        run: cargo test --locked -p shellpp-ssh

      - name: Remove OpenSSH test containers
        if: always()
        run: bash tests/openssh/stop.sh --all

      # shellpp-core and shellpp-ssh stay mobile-ready (docs/architecture.md,
      # section 2.3). The C parts (bundled SQLite, ring) are compiled with the
      # runner's NDK.
      - name: Android check (shellpp-core, shellpp-ssh)
        run: |
          ndk_bin="${ANDROID_NDK_LATEST_HOME:?Android NDK not found on the runner}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo check --locked -p shellpp-core -p shellpp-ssh --target aarch64-linux-android

      - name: Build the app
        run: cargo build --locked -p shellpp-desktop

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Includes the shellpp-ssh suite against the russh test server and the
      # headless GPUI tests of the desktop app.
      - name: Rust tests
        env:
          SHELLPP_TEST_SSHD: russh
          SHELLPP_TEST: "1"
        run: cargo test --locked --workspace

      - name: Build the app
        run: cargo build --locked -p shellpp-desktop

      # Informational only (owner's stage 1, step 4): idle memory of the
      # release build on 300 demo hosts (a temporary profile, in-memory
      # secret store), 10 s after the window appears. The step never fails
      # the job: a missing desktop session or GPU on the runner only shows
      # up as a failed step in the log.
      - name: Idle memory, release, 300 hosts (informational)
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        env:
          SHELLPP_TEST: "1"
        run: ./scripts/measure-idle.ps1

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add aarch64-apple-ios
          rustc --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Includes the shellpp-ssh suite against the russh test server and the
      # headless GPUI tests of the desktop app.
      - name: Rust tests
        env:
          SHELLPP_TEST_SSHD: russh
          SHELLPP_TEST: "1"
        run: cargo test --locked --workspace

      # shellpp-core and shellpp-ssh stay mobile-ready (docs/architecture.md,
      # section 2.3).
      - name: iOS check (shellpp-core, shellpp-ssh)
        run: cargo check --locked -p shellpp-core -p shellpp-ssh --target aarch64-apple-ios

      # Release build of the app, without packages (the .dmg arrives in
      # stage 9). The screens are verified with docs/testing/macos-checklist.md.
      - name: Build the app
        run: cargo build --locked --release -p shellpp-desktop
