[package]
name = "shellpp-desktop"
description = "Shell++ desktop application on GPUI Kit: windows, screens, theme and the platform services around shellpp-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "shellpp"

[lib]
name = "shellpp_desktop"
path = "src/lib.rs"

[[bin]]
name = "shellpp"
path = "src/main.rs"

[features]
default = []
# Developer tools (src/dev): `--demo` (a temporary profile with generated
# data) and other flags that never ship. Release builds never enable it.
dev-tools = []
# `--screenshots <dir> --size WxH` (src/dev/screenshots.rs, used by
# scripts/ui-screens.ps1): renders our own window offscreen through GPUI
# (`Window::render_to_image`, which needs gpui-kit's test-support) and saves
# PNGs. A separate feature, so `--demo` builds (memory measurement) stay
# without test-support.
# The stage 4 states sign a demo certificate (ssh-key).
screenshots = ["dev-tools", "gpui-kit/test-support", "dep:ssh-key"]

[dependencies]
regex.workspace = true
# Only for the screenshot run's demo certificate (feature `screenshots`).
ssh-key = { workspace = true, optional = true }
shellpp-core.workspace = true
shellpp-private-file.workspace = true

# GPUI Kit re-exports GPUI (`gpui_kit::*`), gpui-component and the icons.
gpui-kit.workspace = true
# Version guards only (see the workspace Cargo.toml); never used in code.
gpui-pre-pin.workspace = true

futures.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
secrecy.workspace = true
thiserror.workspace = true
ureq.workspace = true
semver.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
# Strength indicator of the master password (lock::strength).
zxcvbn.workspace = true
arboard.workspace = true
# The terminal view (src/terminal): emulator and the parser thread's queue.
alacritty_terminal.workspace = true
unicode-width.workspace = true
async-channel.workspace = true
# Sessions (src/sessions): SSH and local terminals on a Tokio runtime of
# their own (GPUI has its own executor), the remote charset.
shellpp-ssh.workspace = true
shellpp-term-local.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
encoding_rs.workspace = true
zeroize.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Version guard only (see the workspace Cargo.toml).
gpui-pre-platform-pin.workspace = true

# OS keychain for "remember on this device" (docs/architecture.md, section 5.2).
# Never the features sync-secret-service or vendored (libdbus, D4).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
# The drive letters of the local file panel without touching a drive
# (GetLogicalDrives in platform/drives.rs), and the user's time zone and
# date format (platform/local_time.rs; CONTRIBUTING.md, "Unsafe code").
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Time",
] }
# The registration of the app identity for the user (app/identity.rs, D83).
windows-registry.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

# Linux: the Secret Service through zbus on its own async-io executor (GPUI
# has no Tokio runtime, so not the "tokio" flavour).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "crypto-rust", "async-io"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
# The version resource of shellpp.exe on Windows (build.rs; D82). MIT/Apache;
# already in the tree through GPUI.
embed-resource = "3.0"

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`, `gpui_kit::test::TestWindowExt`):
# the same version as the normal dependency, plus `test-support`.
gpui-kit = { workspace = true, features = ["test-support"] }
# Host panel tests generate SSH keys and certificates at run time for the
# "+ -> Key" and "+ -> Certificate" flows (already in the tree via shellpp-core).
ssh-key.workspace = true
getrandom.workspace = true
# Session integration tests (tests/sessions.rs, tests/servers): the russh
# test server in process on its own Tokio runtime when Docker is not
# running, otherwise the OpenSSH container of tests/openssh.
shellpp-test-sshd.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
tempfile.workspace = true

[lints]
workspace = true
