[package]
name = "shellpp-core"
description = "Shell++ core: data model, cryptography, storage, lock, in-memory index, settings, notifications and platform traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# `Core::sync_conflict_insert_for_test`: writes a sync conflict copy without
# a server (UI 13.6); `Core::sync_duplicates_scan` and
# `Core::sync_duplicate_copy_for_test`: list duplicate pairs as a pull would
# and write a record's copy as another device would (UI 13.7). For the tests
# and the desktop's screenshot run.
# Never in a release build (only dev-dependencies and the `screenshots`
# feature).
test-hooks = []

# shellpp-core must stay mobile-ready (docs/architecture.md, section 1.2):
# no tauri, keyring or other desktop-only crates, and no OS directory lookups.
[dependencies]
shellpp-sync-api.workspace = true
shellpp-private-file.workspace = true

argon2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
getrandom.workspace = true
subtle.workspace = true
zeroize.workspace = true
secrecy.workspace = true

rusqlite.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
data-encoding.workspace = true
unicode-normalization.workspace = true
time.workspace = true

thiserror.workspace = true
tracing.workspace = true
# Character sets of imported PuTTY sessions and CSV files (run 8, D140,
# D141); already in the tree through GPUI.
encoding_rs.workspace = true

# Stage 2: key import and fingerprints ("+ -> Key", docs/data-model.md, section
# 9.1), hashed known_hosts matching (section 9.5) and the history secret
# detector (docs/security.md, section 10).
ssh-key.workspace = true
hmac.workspace = true
sha1.workspace = true
regex.workspace = true

# Stage 3: key import formats and key generation (src/keys/convert.rs,
# src/keys/generate.rs).
pkcs8.workspace = true
pkcs1.workspace = true
sec1.workspace = true
rsa.workspace = true
p256.workspace = true
p384.workspace = true
p521.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
md5.workspace = true
aes.workspace = true
cbc.workspace = true

reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
x509-cert.workspace = true
webpki.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The integration tests use the test hooks (`Core::sync_duplicates_scan`).
shellpp-core = { path = ".", features = ["test-hooks"] }
# Canary test: captured log output must not contain secrets (docs/security.md, section 7).
tracing-subscriber.workspace = true
# Key format tests (tests/key_formats.rs): keys generated at run time are
# written as PKCS#1, PKCS#8 and SEC1 by the crates that define them.
rsa = { workspace = true, features = ["encoding"] }
p256 = { workspace = true, features = ["pkcs8", "alloc"] }
p384 = { workspace = true, features = ["pkcs8", "alloc"] }
p521 = { workspace = true, features = ["pkcs8", "alloc"] }
ed25519-dalek = { workspace = true, features = ["pkcs8", "alloc"] }
# Test certificates for the sync TLS tests (docs/sync-protocol.md, section 2.1).
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }

[lints]
workspace = true
