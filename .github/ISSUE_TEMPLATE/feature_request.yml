name: Feature request
description: Suggest new behavior or an improvement for Shell++.
title: "feat: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Describe the behavior you want in your own words. Shell++ is a clean-room implementation, so do not include screenshots, assets, texts or code from proprietary clients.

        **Security issues must not be reported here.** Follow [SECURITY.md](https://github.com/proxyboy228/shellpp/blob/main/SECURITY.md) to report them privately.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Who is affected, and in which situations?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how it should work, in your own words. Include the user flow, settings and edge cases you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you considered, and why they are not sufficient.
  - type: input
    id: spec-section
    attributes:
      label: Related spec section
      description: The section of SPEC.md or a document in docs/ that this request relates to, if any.
      placeholder: "e.g. docs/ui-behavior-spec.md 4.2"
  - type: textarea
    id: principles
    attributes:
      label: Fit with the core principles
      description: |
        How does this fit the core principles in SPEC.md? Local-first (works offline without an account or a server), no telemetry, license checks or phone-home, and data always stays readable locally and exportable to open formats.
  - type: checkboxes
    id: clean-room
    attributes:
      label: Clean room
      options:
        - label: This request describes behavior in my own words and contains no screenshots, assets, texts or code from proprietary clients
          required: true
