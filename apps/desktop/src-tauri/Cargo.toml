[package]
name = "shellpp-desktop"
description = "Shell++ desktop application: the Tauri host (windows, commands, events, platform implementations)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "shellpp"

[lib]
name = "shellpp_desktop"
path = "src/lib.rs"

[[bin]]
name = "shellpp"
path = "src/main.rs"

[features]
default = []
# In-memory platform mocks and the `e2e_mock` command for UI e2e tests
# (docs/architecture.md, section 5.4). Debug builds only: a release build
# with this feature fails to compile.
e2e-mocks = []

[dependencies]
shellpp-core.workspace = true
shellpp-ssh.workspace = true

tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-opener.workspace = true

serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
secrecy.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
dirs.workspace = true
arboard.workspace = true
url.workspace = true
# Remote charset of terminal sessions (host `charset`, stage 2 plan, section 4.5).
encoding_rs.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance.workspace = true
# Local terminal, desktop targets only (docs/architecture.md, section 2.3).
shellpp-term-local.workspace = true

# OS keychain for "remember on this device" (docs/architecture.md, section 5.2).
# Never the features sync-secret-service or vendored (libdbus, D4).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "crypto-rust", "tokio"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Session manager tests against the russh test server.
shellpp-test-sshd.workspace = true

[lints]
workspace = true
