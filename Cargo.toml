# Client Cargo workspace (docs/architecture.md, sections 2.1 and 2.3).
# The sync server is AGPL-3.0-only and lives in its own workspace under server/.
[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/sync-api",
    "crates/ssh",
    "crates/term-local",
    "crates/private-file",
    "tests/sshd",
    "apps/desktop",
]
exclude = ["server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The minimum for gpui-pre 0.3.9 (via gpui-kit). The toolchain itself is
# pinned in rust-toolchain.toml; MSRV-aware resolution (resolver 3) keeps
# dependency versions buildable with this version.
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/proxyboy228/shellpp"
authors = ["Shell++ contributors"]
publish = false

[workspace.dependencies]
# Project crates.
shellpp-core = { path = "crates/core" }
shellpp-sync-api = { path = "crates/sync-api" }
shellpp-ssh = { path = "crates/ssh" }
shellpp-term-local = { path = "crates/term-local" }
shellpp-private-file = { path = "crates/private-file" }
shellpp-test-sshd = { path = "tests/sshd" }

# Cryptography (docs/security.md, section 5.1; docs/architecture.md, section 8.2).
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13.0"
# "zeroize": SHA-256 states (also inside HMAC and HKDF, via digest/zeroize)
# are wiped on drop; they hold key material (docs/security.md, section 5.3).
sha2 = { version = "0.11.1", default-features = false, features = ["zeroize"] }
# "sys_rng": the OS random source as a rand_core RNG for ssh-key (key
# generation and key encryption, docs/data-model.md, section 9.1).
getrandom = { version = "0.4.3", features = ["sys_rng"] }
subtle = "2.6.1"
zeroize = { version = "1.9.1", features = ["derive"] }
secrecy = { version = "0.10.3", features = ["serde"] }

# SSH (docs/architecture.md, section 8.2; decision 4): russh with default
# features off and the ring backend. "rsa" enables RSA keys (ssh-rsa with
# rsa-sha2-256/512 signatures, docs/data-model.md, section 9.1); the rsa crate
# has the documented advisory exception RUSTSEC-2023-0071 in deny.toml.
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
# SFTP client over a russh channel (stage 4, D45); Apache-2.0.
russh-sftp = { version = "=3.0.1", default-features = false }
# The exact ssh-key version russh 0.64.1 pins, so that shellpp-core parses keys
# with the same crate (key import, fingerprints, known_hosts blobs).
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519", "p256", "p384", "p521", "rsa", "encryption", "ppk"] }
# Key import formats besides OpenSSH (stage 3, docs/data-model.md, section
# 9.1; D5): PEM PKCS#1, PKCS#8 (PBES2-encrypted too), SEC1 and the legacy
# OpenSSL PEM encryption (MD5 key derivation, AES-CBC). The exact versions
# that ssh-key and russh already build, so no new crates ship.
pkcs8 = { version = "0.11.0", default-features = false, features = ["encryption", "std"] }
pkcs1 = { version = "=0.8.0-rc.4", default-features = false }
sec1 = { version = "0.8.1", default-features = false, features = ["der"] }
rsa = { version = "=0.10.0-rc.18", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["pkcs8"] }
p384 = { version = "0.14.0", default-features = false, features = ["pkcs8"] }
p521 = { version = "0.14.0", default-features = false, features = ["pkcs8"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["pkcs8"] }
md5 = "0.8.1"
aes = "0.9.3"
cbc = "0.2.1"
# HMAC-SHA1 matching of hashed known_hosts entries (docs/data-model.md, section 9.5; D21).
hmac = "0.13.0"
sha1 = { version = "0.11.0", default-features = false }
# Local terminal (desktop only, decision 5).
portable-pty = "0.9.0"
# Terminal emulation for the desktop terminal view (decision 30): VT parser,
# grid and scrollback; our own GPUI element draws it. Without "serde".
alacritty_terminal = { version = "0.26.0", default-features = false }
# Character widths for the terminal's zero-width cap: the same crate (and,
# through semver unification, the same version) alacritty_terminal measures
# with, so both agree which characters are zero-width.
unicode-width = "0.2.0"
# Bounded byte queue from the session layer (any thread or runtime) to a
# terminal's parser thread (flow control, decision 30).
async-channel = "2.5.0"
# Remote charset of SSH sessions (host `charset`, WHATWG labels; already in
# the tree through GPUI).
encoding_rs = "0.8.35"
# History secret detector and password prompt patterns (docs/security.md, section 10).
regex = "1.13.1"
# Test-only key generation in the russh test server.
rand = "0.10.0"

# Storage, ids, encoding.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
data-encoding = "2.11.1"
unicode-normalization = "0.1.26"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }

# Errors, logging, runtime.
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry", "env-filter"] }
tokio = { version = "1.53.3", features = ["time", "sync", "macros", "rt"] }

# Desktop UI (docs/architecture.md, section 3.4): GPUI Kit. gpui-kit 0.7.3
# re-exports GPUI and pins the exact GPUI snapshot (gpui-pre and
# gpui-pre-platform 0.3.9). The two `-pin` entries repeat that pin under other
# names (code never uses them; GPUI is `gpui_kit::*`), so that an upgrade of
# gpui-kit that moves GPUI fails to resolve until they are updated on purpose.
# Upgrade all three together with the toolchain in rust-toolchain.toml.
gpui-kit = "=0.7.3"
gpui-pre-pin = { package = "gpui-pre", version = "=0.3.9", default-features = false }
gpui-pre-platform-pin = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false }
# Channel from the core's event sink (any thread) to the UI thread.
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
keyring = { version = "3.6.3", default-features = false }
dirs = "7.0.0"
# The OS clipboard for the core (sensitive values are marked for exclusion
# from clipboard history, docs/security.md, section 9.4).
arboard = { version = "3.7.0", default-features = false }
libc = "0.2.191"
# Windows: the DACL of private files (crates/private-file, D42); already in
# the lockfile through other crates.
windows-sys = { version = "0.61.2", default-features = false }
# Master password strength indicator of the first-run screen (UI 13.1), MIT.
# Without the default "builder" feature (derive_builder is not needed).
zxcvbn = { version = "3.1.1", default-features = false }

# Tests.
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Debug info costs most of target/ on a small disk: the workspace crates keep
# line tables (backtraces with file and line), the dependencies none.
[profile.release]
# Run 4, plan 9.5 (D82): one optimization unit for the whole program and
# no symbols. Unwinding stays: two startup paths catch a panic of the OS
# keychain library on a helper thread.
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# KDF parameters are never weakened in tests (docs/architecture.md, section 9.4).
# Instead the crypto crates are optimized in the dev and test profiles.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# RSA key generation (3072 and 4096 bits, stage 3) takes minutes unoptimized.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3
